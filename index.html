<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#073f36" />
    <title>Nge.Explore Aceh — Discover with Ease</title>
    <meta
      name="description"
      content="Jelajahi pesona alam, sejarah, kuliner UMKM, dan akomodasi ramah Muslim di Aceh bersama Nge.Explore Aceh dengan itinerary planner dan akses berbasis role."
    />
    <meta property="og:title" content="Nge.Explore Aceh — Discover with Ease" />
    <meta
      property="og:description"
      content="Jelajahi pesona alam, sejarah, kuliner UMKM, dan akomodasi ramah Muslim di Aceh bersama Nge.Explore Aceh."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#main-content" id="skipLink">Lewati ke konten utama</a>

    <header class="site-header" id="siteHeader">
      <div class="container header-inner">
        <a class="brand" href="#home" data-route="home" aria-label="Nge.Explore Aceh Beranda">
          <svg class="brand-mark" width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#073f36" />
            <path d="M16 6L18.4 13.6L26 16L18.4 18.4L16 26L13.6 18.4L6 16L13.6 13.6L16 6Z" stroke="#d9b45b" stroke-width="1.6" stroke-linejoin="round" />
            <circle cx="16" cy="16" r="2.2" fill="#d9b45b" />
          </svg>
          <span class="brand-name">Nge.Explore Aceh</span>
        </a>

        <button
          class="nav-toggle"
          id="navToggle"
          type="button"
          aria-expanded="false"
          aria-controls="primaryNav"
          aria-label="Buka menu navigasi"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="17" x2="20" y2="17" />
          </svg>
        </button>

        <nav class="primary-nav" id="primaryNav" aria-label="Navigasi utama">
          <a href="#home" class="nav-link is-active" data-route="home" data-i18n="navHome">Beranda</a>
          <a href="#destinations" class="nav-link" data-route="destinations" data-i18n="navDest">Destinasi</a>
          <a href="#culinary" class="nav-link" data-route="culinary" data-i18n="navFood">Kuliner</a>
          <a href="#stays" class="nav-link" data-route="stays" data-i18n="navStay">Akomodasi</a>
          <a href="#planner" class="nav-link" data-route="planner" data-i18n="navPlan">Rencana Trip</a>
          <a href="#recommend" class="nav-link" data-route="recommend" data-i18n="navReco">Rekomendasi</a>
          <a href="#workspace" class="nav-link is-hidden" id="navWorkspaceLink" data-route="workspace"></a>
        </nav>

        <div class="header-actions" id="headerActions">
          <button
            class="lang-switch"
            id="langBtn"
            type="button"
            aria-label="Ganti bahasa ke English"
          >
            EN
          </button>
          <a href="#login" class="btn btn-sm" id="headerAuthBtn" data-route="login" data-i18n="navLogin">Masuk</a>
        </div>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <section id="page-home" class="page-section" aria-labelledby="heroTitle"></section>
      <section id="page-destinations" class="page-section is-hidden" aria-labelledby="destHeading"></section>
      <section id="page-culinary" class="page-section is-hidden" aria-labelledby="foodHeading"></section>
      <section id="page-stays" class="page-section is-hidden" aria-labelledby="stayHeading"></section>
      <section id="page-planner" class="page-section is-hidden" aria-labelledby="plannerHeading"></section>
      <section id="page-recommend" class="page-section is-hidden" aria-labelledby="recoHeading"></section>
      <section id="page-login" class="page-section is-hidden" aria-labelledby="loginHeading"></section>
      <section id="page-workspace" class="page-section is-hidden" aria-labelledby="workspaceHeading"></section>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <div
      id="appModal"
      class="modal-backdrop is-hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-dialog" role="document">
        <button class="modal-close" id="modalCloseBtn" type="button" aria-label="Tutup dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
        <div id="modalBody"></div>
      </div>
    </div>

    <div id="appToast" class="toast is-hidden" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
